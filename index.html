<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skanky Banks</title>
  <meta name="description" content="Skanky Banks — ska, cumbia & good times. Stream and download the music." />
  <meta property="og:title" content="Skanky Banks" />
  <meta property="og:description" content="Ska, cumbia & good times. Stream and download the music." />
  <meta property="og:image" content="assets/img/banner.jpg" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="assets/img/album-cover.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== NAV ===== -->
  <header class="nav" id="nav">
    <a href="#top" class="nav__brand">SKANKY&nbsp;BANKS</a>
    <nav class="nav__links">
      <a href="#music">Music</a>
      <a href="#contact">Contact</a>
    </nav>
    <button class="nav__toggle" id="navToggle" aria-label="Menu">☰</button>
  </header>

  <!-- ===== MUSIC ===== -->
  <section class="section" id="music" aria-labelledby="music-title">
    <div class="section__head">
      <h1 id="music-title" class="section__title">Skanky Banks</h1>
      <p class="section__sub">Ska &middot; Cumbia. Stream it, then name your price to download.</p>
    </div>

    <div class="releases" id="releases"><!-- populated by script.js --></div>
  </section>

  <!-- ===== CONTACT ===== -->
  <section class="section section--alt" id="contact">
    <div class="section__head">
      <h2 class="section__title">Stay in Touch</h2>
      <p class="section__sub">Get on the list &amp; follow along.</p>
    </div>
    <div class="contact">
      <div class="socials">
        <!-- Replace # with your real profile URLs -->
        <a href="#" target="_blank" rel="noopener">Instagram</a>
        <a href="#" target="_blank" rel="noopener">YouTube</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Skanky Banks. All rights reserved.</p>
  </footer>

  <!-- ===== STICKY PLAYER BAR ===== -->
  <div class="playerbar" id="playerbar" aria-hidden="true">
    <img class="playerbar__art" id="pbArt" alt="" />
    <div class="playerbar__meta">
      <span class="playerbar__title" id="pbTitle">—</span>
      <span class="playerbar__album" id="pbAlbum"></span>
    </div>
    <button class="playerbar__btn" id="pbPrev" aria-label="Previous">⏮</button>
    <button class="playerbar__btn playerbar__btn--play" id="pbPlay" aria-label="Play">▶</button>
    <button class="playerbar__btn" id="pbNext" aria-label="Next">⏭</button>
    <div class="playerbar__progress" id="pbProgress">
      <div class="playerbar__bar" id="pbBar"></div>
    </div>
    <span class="playerbar__time" id="pbTime">0:00 / 0:00</span>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
